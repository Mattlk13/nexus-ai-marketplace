name: VirtualBox / Vagrant Environment Tests

on:
  workflow_dispatch:
    inputs:
      vm_box:
        description: "Vagrant box to use (e.g. ubuntu/jammy64)"
        required: true
        default: "ubuntu/jammy64"
      test_script:
        description: "Test script to run inside VM"
        required: false
        default: "scripts/integration-test.sh"

# NOTE: VirtualBox requires a self-hosted runner with nested virtualization enabled.
# GitHub-hosted runners do NOT support VirtualBox.
# Use a self-hosted runner tagged with 'virtualbox' for this workflow.
jobs:
  virtualbox-integration-test:
    name: VirtualBox Integration Test
    runs-on: [self-hosted, virtualbox]
    # Falls back to ubuntu-latest for environments without VirtualBox
    # (will skip the VM steps and run tests directly)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check VirtualBox availability
        id: vbox_check
        run: |
          if command -v vboxmanage &> /dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
            vboxmanage --version
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ VirtualBox not available on this runner — skipping VM tests"
          fi

      - name: Setup Vagrant
        if: steps.vbox_check.outputs.available == 'true'
        uses: hashicorp/setup-vagrant@v1

      - name: Create Vagrantfile
        if: steps.vbox_check.outputs.available == 'true'
        run: |
          cat > Vagrantfile << 'EOF'
          Vagrant.configure("2") do |config|
            config.vm.box = "${{ github.event.inputs.vm_box }}"
            config.vm.provider "virtualbox" do |vb|
              vb.memory = "2048"
              vb.cpus = 2
              vb.name = "nexus-ci-vm-${{ github.run_id }}"
            end
            config.vm.synced_folder ".", "/vagrant"
            config.vm.provision "shell", inline: <<-SHELL
              apt-get update -q
              apt-get install -y -q nodejs npm
              npm install -g pnpm
            SHELL
          end
          EOF

      - name: Start Vagrant VM
        if: steps.vbox_check.outputs.available == 'true'
        run: vagrant up --provider virtualbox

      - name: Run tests inside VM
        if: steps.vbox_check.outputs.available == 'true'
        run: |
          vagrant ssh -c "cd /vagrant && ${{ github.event.inputs.test_script || 'pnpm test' }}"

      - name: Collect VM logs
        if: always() && steps.vbox_check.outputs.available == 'true'
        run: |
          vagrant ssh -c "journalctl -n 100 --no-pager" > vm-journal.log 2>/dev/null || true

      - name: Upload VM logs
        if: always() && steps.vbox_check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs-${{ github.run_id }}
          path: vm-journal.log
          retention-days: 3

      - name: Destroy VM
        if: always() && steps.vbox_check.outputs.available == 'true'
        run: vagrant destroy -f

  vboxmanage-vm-inventory:
    name: VirtualBox VM Inventory Report
    runs-on: [self-hosted, virtualbox]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: List all VMs
        run: |
          if command -v vboxmanage &> /dev/null; then
            echo "=== Running VMs ==="
            vboxmanage list runningvms
            echo ""
            echo "=== All VMs ==="
            vboxmanage list vms
          else
            echo "VirtualBox not available on this runner"
          fi
