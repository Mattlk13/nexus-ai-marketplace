# ─────────────────────────────────────────────────────────────────────────────
# NEXUS AI Marketplace — Continuous Integration Pipeline
# Triggers: every push to main/develop, every pull request targeting main
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

# ─── Job 1: Install & Cache ───────────────────────────────────────────────────
jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Cache node_modules for downstream jobs in this workflow run
      - name: Save node_modules to cache
        uses: actions/cache/save@v4
        id: cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ─── Job 2: TypeScript Type Check ────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install if cache miss
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit
        # Annotate PR with type errors automatically
      - name: Annotate type errors on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **TypeScript type check failed.** Please run `pnpm exec tsc --noEmit` locally and fix all type errors before merging.'
            })

  # ─── Job 3: Lint & Format Check ──────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install if cache miss
        run: pnpm install --frozen-lockfile
      - name: Check Prettier formatting
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}" --ignore-path .prettierignore
      - name: Run ESLint (if configured)
        run: |
          if [ -f ".eslintrc*" ] || [ -f "eslint.config*" ]; then
            pnpm exec eslint . --ext .ts,.tsx --max-warnings 0
          else
            echo "No ESLint config found — skipping (add eslint.config.ts to enable)"
          fi

  # ─── Job 4: Unit & Integration Tests with Coverage ───────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: install
    # Spin up a real MySQL 8 service container for integration tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: nexus_test
          MYSQL_USER: nexus
          MYSQL_PASSWORD: nexuspass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://nexus:nexuspass@127.0.0.1:3306/nexus_test
      JWT_SECRET: ci-test-jwt-secret-32-chars-long!!
      NODE_ENV: test
      # Stub external service keys for unit tests
      BUILT_IN_FORGE_API_KEY: ci-stub-key
      BUILT_IN_FORGE_API_URL: http://localhost:9999
      VITE_APP_ID: ci-app-id
      OAUTH_SERVER_URL: http://localhost:9999
      OWNER_OPEN_ID: ci-owner
      OWNER_NAME: CI Owner
      STRIPE_SECRET_KEY: sk_test_ci_stub
      STRIPE_WEBHOOK_SECRET: whsec_ci_stub
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_stub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install if cache miss
        run: pnpm install --frozen-lockfile

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u nexus -pnexuspass --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Run database migrations on test DB
        run: pnpm db:push
        env:
          DATABASE_URL: mysql://nexus:nexuspass@127.0.0.1:3306/nexus_test

      - name: Run Vitest with coverage
        run: pnpm exec vitest run --coverage --reporter=verbose --reporter=junit --outputFile=test-results.xml
        continue-on-error: false

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      # Post coverage summary as PR comment
      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## 🧪 Test Results\n\n';
            try {
              // Read coverage summary if it exists
              if (fs.existsSync('coverage/coverage-summary.json')) {
                const cov = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
                const total = cov.total;
                summary += `| Metric | Coverage |\n|---|---|\n`;
                summary += `| Lines | ${total.lines.pct}% |\n`;
                summary += `| Statements | ${total.statements.pct}% |\n`;
                summary += `| Functions | ${total.functions.pct}% |\n`;
                summary += `| Branches | ${total.branches.pct}% |\n`;
              } else {
                summary += '_Coverage report not available._\n';
              }
            } catch (e) {
              summary += `_Could not parse coverage: ${e.message}_\n`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  # ─── Job 5: Production Build Verification ────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    env:
      NODE_ENV: production
      VITE_APP_ID: build-check
      VITE_OAUTH_PORTAL_URL: https://placeholder.manus.im
      VITE_FRONTEND_FORGE_API_URL: https://placeholder.manus.im
      VITE_FRONTEND_FORGE_API_KEY: build-check-key
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_build_check
      VITE_ANALYTICS_ENDPOINT: https://placeholder.manus.im
      VITE_ANALYTICS_WEBSITE_ID: build-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install if cache miss
        run: pnpm install --frozen-lockfile
      - name: Build frontend (Vite) + backend (esbuild)
        run: pnpm build
      - name: Check build output exists
        run: |
          test -d dist || (echo "❌ Build failed: dist/ directory not found" && exit 1)
          echo "✅ Build succeeded. Output size:"
          du -sh dist/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─── Job 6: Security Audit ───────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install if cache miss
        run: pnpm install --frozen-lockfile

      # npm audit — fail on high/critical vulnerabilities
      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # Report but don't block on transitive deps

      # Secret scanning with gitleaks
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional for orgs

      # CodeQL static analysis (JavaScript/TypeScript)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # ─── Job 7: CI Summary Gate ──────────────────────────────────────────────────
  ci-gate:
    name: CI Gate (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build, security]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          echo "TypeCheck: ${{ needs.typecheck.result }}"
          echo "Lint:      ${{ needs.lint.result }}"
          echo "Test:      ${{ needs.test.result }}"
          echo "Build:     ${{ needs.build.result }}"
          echo "Security:  ${{ needs.security.result }}"

          if [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ One or more required CI checks failed."
            exit 1
          fi
          echo "✅ All required CI checks passed."
