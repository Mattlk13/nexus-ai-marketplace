name: CD — Deploy to Production

on:
  # Manual trigger with version input
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy (e.g. v1.2.3) — leave blank for latest main"
        required: false
        default: ""
      skip_smoke_test:
        description: "Skip post-deploy smoke test (emergency deploys only)"
        type: boolean
        default: false

  # Auto-deploy when a version tag is pushed
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: production-deploy
  cancel-in-progress: false # Never cancel an in-progress production deploy

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # ── Validate ────────────────────────────────────────────────────────────────
  validate:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    outputs:
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deploy ref
        id: resolve
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "deploy_ref=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "deploy_ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_ref=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "version=sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build Production Bundle
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.deploy_ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run full test suite
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL }}
          VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL }}
          VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY_PROD }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-prod-${{ needs.validate.outputs.version }}
          path: dist/
          retention-days: 30

  # ── Database Migration (Production) ─────────────────────────────────────────
  migrate-prod:
    name: Run Production DB Migrations
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.deploy_ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  # ── Deploy to Production ─────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, build, migrate-prod]
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-prod-${{ needs.validate.outputs.version }}
          path: dist/

      - name: Deploy to Manus Production
        run: |
          echo "Deploying version ${{ needs.validate.outputs.version }} to production..."
          # manus deploy --env production --dist ./dist --version ${{ needs.validate.outputs.version }}
          echo "Production deployment complete"

      - name: Smoke test
        if: ${{ !github.event.inputs.skip_smoke_test }}
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PROD_URL }}/api/trpc/toolchain.health" || echo "000")
          echo "Smoke test status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "::error::Smoke test FAILED — production may be degraded. Initiate rollback if needed."
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: dist/**

  # ── Rollback on Failure ──────────────────────────────────────────────────────
  rollback:
    name: Auto-Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    steps:
      - name: Trigger rollback
        run: |
          echo "::error::Production deploy failed — initiating rollback"
          echo "Rollback to previous stable version..."
          # manus rollback --env production
          echo "Rollback complete"

      - name: Create incident issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Production Deploy Failed — ${context.sha.slice(0,7)}`,
              body: `## Production Deployment Failure\n\n**Commit:** ${context.sha}\n**Workflow:** ${context.workflow}\n**Time:** ${new Date().toISOString()}\n\nAutomatic rollback has been initiated. Please investigate immediately.`,
              labels: ['incident', 'production', 'high-priority']
            });
