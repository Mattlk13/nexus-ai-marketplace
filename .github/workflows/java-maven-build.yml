name: Java / Maven CI (Eclipse & NetBeans Projects)

on:
  push:
    paths:
      - "java-projects/**"
      - ".github/workflows/java-maven-build.yml"
  pull_request:
    paths:
      - "java-projects/**"
  workflow_dispatch:
    inputs:
      project_path:
        description: "Path to Maven project (relative to repo root)"
        required: true
        default: "java-projects/sample-app"

jobs:
  maven-build:
    name: Maven Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [11, 17, 21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B clean package --no-transfer-progress
        working-directory: ${{ github.event.inputs.project_path || 'java-projects/sample-app' }}

      - name: Run tests
        run: mvn -B test --no-transfer-progress
        working-directory: ${{ github.event.inputs.project_path || 'java-projects/sample-app' }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java-version }}
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts-java${{ matrix.java-version }}
          path: "**/target/*.jar"
          retention-days: 14

  eclipse-che-deploy:
    name: Deploy to Eclipse Che (if configured)
    runs-on: ubuntu-latest
    needs: maven-build
    if: github.ref == 'refs/heads/main' && vars.ECLIPSE_CHE_URL != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy workspace devfile to Eclipse Che
        run: |
          curl -s -X POST \
            "${{ vars.ECLIPSE_CHE_URL }}/api/workspace" \
            -H "Authorization: Bearer ${{ secrets.ECLIPSE_CHE_TOKEN }}" \
            -H "Content-Type: application/yaml" \
            --data-binary @devfile.yaml || echo "Eclipse Che deploy skipped (no devfile.yaml)"

  netbeans-module-build:
    name: NetBeans Platform Module Build
    runs-on: ubuntu-latest
    if: hashFiles('**/nbproject/project.xml') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: Build NetBeans module with Ant
        run: |
          if [ -f "build.xml" ]; then
            ant -q clean build
          else
            echo "No Ant build.xml found — skipping NetBeans module build"
          fi
