name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options:
          - staging
          - production
      target_version:
        description: "Version or commit SHA to roll back to"
        required: true
      reason:
        description: "Reason for rollback (required for audit trail)"
        required: true

jobs:
  rollback:
    name: Rollback ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate target version
        run: |
          TARGET="${{ github.event.inputs.target_version }}"
          if ! git rev-parse "$TARGET" &>/dev/null; then
            echo "::error::Target version '$TARGET' not found in git history"
            exit 1
          fi
          echo "Rolling back to: $(git log --oneline -1 $TARGET)"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Checkout target version
        run: git checkout ${{ github.event.inputs.target_version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rollback bundle
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Deploy rollback
        run: |
          echo "Rolling back ${{ github.event.inputs.environment }} to ${{ github.event.inputs.target_version }}"
          # manus deploy --env ${{ github.event.inputs.environment }} --dist ./dist
          echo "Rollback deploy complete"

      - name: Verify rollback
        run: |
          sleep 15
          ENV_URL="${{ github.event.inputs.environment == 'production' && vars.PROD_URL || vars.STAGING_URL }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ENV_URL/api/trpc/toolchain.health" || echo "000")
          echo "Post-rollback health check: $STATUS"

      - name: Create rollback audit issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔄 Rollback: ${{ github.event.inputs.environment }} → ${{ github.event.inputs.target_version }}`,
              body: [
                '## Rollback Audit Record',
                '',
                `**Environment:** ${{ github.event.inputs.environment }}`,
                `**Target Version:** ${{ github.event.inputs.target_version }}`,
                `**Initiated By:** @${context.actor}`,
                `**Time:** ${new Date().toISOString()}`,
                `**Reason:** ${{ github.event.inputs.reason }}`,
                '',
                '## Next Steps',
                '- [ ] Identify root cause of the issue that required rollback',
                '- [ ] Create fix branch and PR',
                '- [ ] Re-deploy after fix is verified in staging',
                '- [ ] Close this issue when resolved',
              ].join('\n'),
              labels: ['rollback', 'incident', '${{ github.event.inputs.environment }}']
            });
