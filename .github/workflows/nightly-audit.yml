# ─────────────────────────────────────────────────────────────────────────────
# NEXUS — Nightly Security & Dependency Audit
# Runs every night at 02:00 UTC and can be triggered manually
# ─────────────────────────────────────────────────────────────────────────────
name: Nightly Audit

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC every day
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Full audit report — all severity levels
      - name: Full npm audit report
        run: pnpm audit --json > audit-report.json || true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: audit-report.json
          retention-days: 90

      # Fail if any critical vulnerabilities found
      - name: Fail on critical vulnerabilities
        run: pnpm audit --audit-level=critical

  secret-scan:
    name: Full Repository Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scan
      - name: Deep secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  outdated-deps:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List outdated packages
        run: pnpm outdated || true # Don't fail — just report
      - name: Check for major version updates
        run: |
          echo "## Outdated Packages Report" > outdated.md
          echo "Generated: $(date -u)" >> outdated.md
          echo "" >> outdated.md
          pnpm outdated --format json 2>/dev/null | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            if (Object.keys(data).length === 0) {
              console.log('All packages are up to date!');
            } else {
              console.log('| Package | Current | Latest | Type |');
              console.log('|---|---|---|---|');
              for (const [pkg, info] of Object.entries(data)) {
                console.log(\`| \${pkg} | \${info.current} | \${info.latest} | \${info.dependencyType} |\`);
              }
            }
          " >> outdated.md 2>/dev/null || echo "Could not parse outdated packages" >> outdated.md
          cat outdated.md
      - name: Upload outdated report
        uses: actions/upload-artifact@v4
        with:
          name: outdated-deps-${{ github.run_id }}
          path: outdated.md
          retention-days: 30

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install license checker
        run: pnpm add -g license-checker
      - name: Check for GPL/AGPL licenses (copyleft risk)
        run: |
          license-checker --excludePrivatePackages --onlyAllow \
            "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;0BSD;Python-2.0;BlueOak-1.0.0" \
            --out license-report.csv || echo "⚠️ License check found non-permissive licenses — review required"
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report-${{ github.run_id }}
          path: license-report.csv
          retention-days: 90
