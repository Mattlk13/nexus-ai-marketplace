name: CD — Deploy to Staging

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI — Build, Test & Security"]
    types: [completed]
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # ── Gate: only deploy if CI passed ─────────────────────────────────────────
  gate:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check workflow trigger
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build Production Bundle
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE }}
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL }}
          VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL }}
          VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY_STAGING }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-staging-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Database Migration ──────────────────────────────────────────────────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dry-run migration check
        run: pnpm db:push --dry-run || echo "Dry-run not supported, skipping"
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        continue-on-error: true

      - name: Apply migrations
        run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  # ── Deploy to Staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-staging-${{ github.sha }}
          path: dist/

      - name: Deploy to Manus Staging
        run: |
          echo "Deploying commit ${{ github.sha }} to staging..."
          # Manus platform deployment via CLI or API
          # Replace with your actual deployment command:
          # manus deploy --env staging --dist ./dist
          echo "Deployment complete"

      - name: Health check
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}/api/trpc/toolchain.health" || echo "000")
          echo "Health check status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "::warning::Health check returned $STATUS — verify staging manually"
          fi

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Staging deploy succeeded for ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Staging deploy FAILED for ${{ github.sha }}"
