# ─────────────────────────────────────────────────────────────────────────────
# NEXUS — AI-Powered Code Review & PR Automation
# Triggers on every pull request
# ─────────────────────────────────────────────────────────────────────────────
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_requested:
    types: [review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ── Auto-label PRs based on changed files ──────────────────────────────────
  auto-label:
    name: Auto-Label PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  # ── PR size check (warn on large PRs) ─────────────────────────────────────
  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            let label = '';
            let message = '';

            if (total < 50) {
              label = 'size/XS';
              message = '✅ **XS PR** — Quick review expected.';
            } else if (total < 200) {
              label = 'size/S';
              message = '✅ **Small PR** — Standard review.';
            } else if (total < 500) {
              label = 'size/M';
              message = '⚠️ **Medium PR** — Consider splitting if unrelated changes are bundled.';
            } else if (total < 1000) {
              label = 'size/L';
              message = '⚠️ **Large PR** — Please ensure this is focused on a single concern.';
            } else {
              label = 'size/XL';
              message = '❌ **XL PR** — This PR is very large (+' + total + ' lines). Please split into smaller PRs for easier review.';
            }

            // Add size label
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label]
              });
            } catch (e) {
              console.log('Could not add label (may not exist):', e.message);
            }

            // Post comment only for large PRs
            if (total >= 500) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 📏 PR Size Warning\n\n${message}\n\n**Changes:** +${additions} additions, -${deletions} deletions (${total} total lines)`
              });
            }

            console.log(`PR size: ${total} lines (${label})`);

  # ── Conventional commit message check ─────────────────────────────────────
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check conventional commit format
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const conventionalPattern = /^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert|wip)(\(.+\))?: .{1,100}/;
            const violations = [];

            for (const commit of commits) {
              const msg = commit.commit.message.split('\n')[0];
              // Skip merge commits and automated commits
              if (msg.startsWith('Merge ') || msg.startsWith('Checkpoint:')) continue;
              if (!conventionalPattern.test(msg)) {
                violations.push({ sha: commit.sha.substring(0, 7), msg });
              }
            }

            if (violations.length > 0) {
              const body = [
                '## ⚠️ Commit Message Format',
                '',
                'Some commits do not follow [Conventional Commits](https://www.conventionalcommits.org/) format:',
                '',
                '| SHA | Message |',
                '|---|---|',
                ...violations.map(v => `| \`${v.sha}\` | ${v.msg} |`),
                '',
                '**Expected format:** `type(scope): description`',
                '',
                '**Valid types:** `feat`, `fix`, `docs`, `style`, `refactor`, `perf`, `test`, `chore`, `ci`, `build`, `revert`',
                '',
                '**Examples:**',
                '- `feat(auth): add OAuth2 login flow`',
                '- `fix(upload): handle empty file gracefully`',
                '- `chore(deps): update pnpm to v9.5`'
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            } else {
              console.log('✅ All commits follow conventional format');
            }

  # ── Stale PR detection ─────────────────────────────────────────────────────
  stale-check:
    name: Stale PR Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check if PR is stale (>14 days without activity)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const updatedAt = new Date(pr.updated_at);
            const now = new Date();
            const daysSinceUpdate = (now - updatedAt) / (1000 * 60 * 60 * 24);

            if (daysSinceUpdate > 14) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['stale']
              }).catch(() => {});
              console.log(`PR is stale: ${daysSinceUpdate.toFixed(0)} days since last update`);
            }
